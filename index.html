 {world:0,emoji:'🦆',name:'Parabola Patrol',tag:'CORE',desc:'Spot a true quadratic and predict its shape.',scene:'duck',formula:'y = ax² + bx + c',example:'Is y = −2x² + 3x + 1 quadratic? Which way does its graph open?',steps:['The largest power of x is 2, so this is a quadratic function.','The coefficient of x² is a = −2.','Since a is negative, its parabola opens downwards (∩).'],game:'shape',task:'Open the garden gate: choose the function that makes a downward-opening parabola.',qs:[['Which graph comes from y = 2x² − 1?',['Opens up','Opens down','A straight line'],0,'a = 2 is positive, so the curve opens up.'],['Which is a quadratic function?',['y = 2x + 4','y = 4/x','y = 3x² − 1'],2,'The highest power is x² in the third expression.'],['For y = −x² + 4, what is the y-intercept?',['4','−4','0'],0,'At x = 0, y = 4.']]},
 {world:0,emoji:'🐟',name:'Koi Coordinate Catch',tag:'CORE',desc:'Complete a value table and catch points on the graph.',scene:'pond',formula:'y = x² − 2x − 3',example:'Find y when x = 2 for y = x² − 2x − 3.',steps:['Substitute x = 2 into the rule.','y = (2)² − 2(2) − 3 = 4 − 4 − 3.','So y = −3, giving the point (2, −3).'],game:'plot',task:'Tap these 3 graph coordinates, in order: (−1,0), (1,−4), (3,0).',qs:[['For y = x² − 2x − 3, find y at x = 0.',['−3','3','0'],0,'Substitute x = 0 to obtain −3.'],['For the same graph, find y at x = 1.',['−4','−2','4'],0,'1 − 2 − 3 = −4.'],['Which coordinate is on the graph?',['(4, 5)','(4, −5)','(4, 9)'],0,'16 − 8 − 3 = 5.']]},
 {world:1,emoji:'🐇',name:'Bunny Root Rescue',tag:'CORE',desc:'Put flags where the curve touches or crosses the x-axis.',scene:'bunny',formula:'y = x² − 4',example:'Find the roots of y = x² − 4.',steps:['Roots occur wherever y = 0.','Solve 0 = x² − 4 = (x − 2)(x + 2).','The curve crosses the x-axis at (−2, 0) and (2, 0).'],game:'roots',task:'Tap both roots on the graph to open the rabbit hutch.',qs:[['Find the roots of x² − 9 = 0.',['−3 and 3','0 and 9','−9 and 9'],0,'x² = 9 gives x = ±3.'],['What does a root represent on a graph?',['The y-intercept','An x-axis intersection','The steepest slope'],1,'Roots are x-values where y = 0.'],['How many distinct real roots does y = x² + 4 have?',['0','1','2'],0,'x² cannot equal −4 for real x.']]},

 {world:2,emoji:'⛰️',name:'Vertex Summit',tag:'EXTENDED',desc:'Find the highest or lowest place on a parabola.',scene:'house',formula:'y = −(x − 2)² + 5',example:'Find the turning point and maximum value of y = −(x − 2)² + 5.',steps:['The expression has the form y = a(x − h)² + k.','Here h = 2 and k = 5, so the vertex is (2,5).','a = −1: the graph opens down; 5 is the maximum y-value.'],game:'vertex',task:'Tap the very top of the mountain curve at its turning point.',qs:[['For y = (x + 3)² + 2, the turning point is…',['(3,2)','(−3,2)','(−3,−2)'],1,'x + 3 = x − (−3), so the vertex is (−3,2).'],['For y = −3(x − 1)² + 7, the maximum value is…',['1','−3','7'],2,'Because the graph opens down, k = 7 is the maximum.'],['For y = 2(x − 4)² − 5, the graph has…',['A minimum of −5','A maximum of −5','No turning point'],0,'Positive a means an upward-opening curve.']]},
 {world:2,emoji:'🧩',name:'Square Builder',tag:'EXTENDED',desc:'Find hidden vertex form by completing the square.',scene:'house',formula:'y = x² − 6x + 7',example:'Write x² − 6x + 7 in the form (x − h)² + k.',steps:['Half the x-coefficient: −6 ÷ 2 = −3.','(x − 3)² = x² − 6x + 9. We have added 9, so subtract 9.','x² − 6x + 7 = (x − 3)² − 2. The vertex is (3,−2).'],game:'square',task:'Set h and k to reconstruct the correct completed-square form.',qs:[['x² + 4x + 1 = …',['(x + 2)² − 3','(x + 4)² − 3','(x + 2)² + 3'],0,'(x + 2)² = x² + 4x + 4; subtract 3.'],['x² − 8x + 3 has vertex x-value…',['−4','4','8'],1,'Half −8 is −4, giving (x − 4)².'],['x² + 6x + 11 has minimum value…',['2','9','11'],0,'(x + 3)² + 2, so minimum is 2.']]},
 {world:2,emoji:'🎚️',name:'Mountain Shifter',tag:'EXTENDED',desc:'Move and flip a parabola to match a target.',scene:'garden',formula:'y = a(x − h)² + k',example:'What happens to y = x² when it becomes y = −(x + 2)² + 1?',steps:['The minus sign flips the curve downwards.','x + 2 means its vertex moves 2 units left.','+1 moves the vertex 1 unit up. Vertex: (−2,1).'],game:'shift',task:'Match the glowing target: opens DOWN with vertex (−2,1).',qs:[['The vertex of y = (x − 5)² + 1 is…',['(−5,1)','(5,1)','(5,−1)'],1,'Use y = a(x − h)² + k.'],['Which function opens down?',['y = 2(x − 1)²','y = −2(x − 1)²','y = (x − 1)²'],1,'Negative a opens down.'],['The vertex of y = (x + 4)² − 3 is…',['(−4,−3)','(4,−3)','(−4,3)'],0,'h = −4, k = −3.']]},
 {world:3,emoji:'🦆',name:'Duck Jump Simulator',tag:'CORE + EXTENDED',desc:'Help the duck reach its highest point.',scene:'duck',formula:'h(t) = −t² + 4t + 1',example:'When does h(t) = −t² + 4t + 1 reach its maximum?',steps:['The coefficient of t² is negative, so the arc has a maximum.','The time coordinate of the vertex is t = −b/(2a) = −4/(−2) = 2.','The maximum height is h(2) = −4 + 8 + 1 = 5 metres.'],game:'jump',task:'Slide time until the duck is at its exact maximum height.',qs:[['At t = 0, the duck is at height…',['0 m','1 m','4 m'],1,'h(0) = 1.'],['At t = 3, h(3) is…',['4 m','6 m','3 m'],0,'−9 + 12 + 1 = 4.'],['The maximum height is…',['2 m','4 m','5 m'],2,'At t = 2, height is 5.']]},

];

const STORAGE='kinan.quadraticQuest.pixelGarden.v2';
function defaultSave(){return {done:[],passes:[],xp:0,best:{},sound:false,allOpen:false}}
let saved=defaultSave();try{saved={...defaultSave(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(saved))}catch(e){}}
let route={page:'home'},subStage='learn',stepNum=0,mini={},quiz=0,answered=false,ticket=null,clockInterval=null,toastTimer=null,audioCtx=null,lessonLearned={};
const $=(sel)=>document.querySelector(sel);
const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const worldAvailable=w=>saved.allOpen||w===0||saved.passes.includes(w-1);
const lessonAvailable=i=>saved.allOpen|| (worldAvailable(LESSONS[i].world) && (i===0||saved.done.includes(i-1)));
const worldComplete=w=>WORLDS[w].levelIds.every(id=>saved.done.includes(id));
const pill=(text,cl='')=>`<span class="pill ${cl}">${text}</span>`;
function img(which){return `background-image:url('${ASSETS[which]}')`}
function refreshXP(){document.querySelectorAll('.hud-stat').forEach(e=>e.textContent='⭐ '+saved.xp+' XP')}
function xpEarn(key,n){if(saved.best[key])return; saved.best[key]=true;saved.xp+=n;persist();refreshXP();confetti(10)}
function sfx(type='win'){if(!saved.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='square';o.frequency.value=type==='win'?730:220;g.gain.value=.036;o.start();o.stop(audioCtx.currentTime+.09)}catch(e){}}
function confetti(n=13){for(let i=0;i<n;i++){let el=document.createElement('span');el.className='particle';el.textContent=['⭐','✨','🌻','💚','🌟','🐟'][i%6];el.style.left=(23+Math.random()*54)+'vw';el.style.top=(38+Math.random()*38)+'vh';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}}
function notify(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2800)}
function nav(page,index=null){if(clockInterval){clearInterval(clockInterval);clockInterval=null}route={page,index};subStage='learn';stepNum=0;mini={};quiz=0;answered=false;render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'','#'+page+(index===null?'':'-'+index))}catch(e){}}
function button(label,fn,cls=''){return `<button type="button" class="btn ${cls}" onclick="${fn}">${label}</button>`}
function header(){const screens={home:'Welcome',map:'World Map',world:`World ${(route.index??0)+1}`,lesson:'Adventure Level',exit:'Exit Ticket',teacher:'Teacher Corner'};return `<header class="hud"><button class="btn sm ghost" onclick="goBack()" aria-label="Back">← Back</button><strong class="brand pixel">🌿 QUADRATIC QUEST</strong><div class="hud-actions"><span class="hud-stat" title="Experience points">⭐ ${saved.xp} XP</span><button class="btn sm blue" onclick="nav('map')">🗺️ Map</button><button class="btn sm ghost" onclick="toggleSound()" title="Toggle game sound">${saved.sound?'🔊':'🔇'}</button></div></header>`}
function footer(){return `<div class="footer">Original IGCSE 0580-inspired practice • Grade 9 • ${new Date().getFullYear()} Kinan Learning • Not an official Cambridge publication<br>Works offline. Progress is saved in this browser. For Core use Worlds 1–2, then selected World 4 activities; World 3 is Extended.</div>`}
function render(){let out='';if(route.page==='home')out=home();else if(route.page==='map')out=mapView();else if(route.page==='world')out=worldView(route.index);else if(route.page==='lesson')out=lessonView(route.index);else if(route.page==='exit')out=exitView(route.index);else if(route.page==='teacher')out=teacherView();$('#app').innerHTML=header()+`<main class="shell">${out}${footer()}</main>`;if(route.page==='lesson')initLessonStage();if(route.page==='exit')setupTicket();}
function goBack(){if(route.page==='lesson')nav('world',LESSONS[route.index].world);else if(route.page==='exit')nav('world',route.index);else if(route.page==='world'||route.page==='teacher')nav('map');else if(route.page==='map')nav('home');else nav('home')}
function toggleSound(){saved.sound=!saved.sound;persist();render();notify(saved.sound?'Sound on 🎵':'Sound off 🔇')}
function home(){const total= saved.done.length;return `<section class="paper"><div class="hero world-sparkle" style="${img('village')}"><div class="hero-content"><span class="pill" style="background:#d4ffdc;color:#19443f">🎮 IGCSE GRADE 9 · PIXEL GARDEN</span><h1 class="pixel">QUADRATIC<br><span class="highlight">QUEST!</span></h1><p>Parabolas are taking over the garden. Save ducks, help the bunnies, catch koi and beat the final math boss. Every correct answer opens a new path.</p><div class="button-line">${button(total?'▶ CONTINUE ADVENTURE':'▶ START ADVENTURE',"nav('map')",'green')}${button('📚 TEACHER CORNER',"nav('teacher')",'ghost')}</div></div></div><div class="pane"><div class="three-stats"><div class="stat">🌳 <b>4 WORLDS</b><span class="tiny">4 × 90-min sessions</span></div><div class="stat">🎯 <b>10 LEVELS</b><span class="tiny">Learn → Play → Practise</span></div><div class="stat">⏳ <b>4 TIMED EXITS</b><span class="tiny">10 minutes each</span></div><div class="stat">🏆 <b>${total}/10 CLEARED</b><span class="tiny">Saved automatically</span></div></div><div class="sprint"><strong>HOW TO PLAY:</strong> Click a world on the map → study a short worked example → win its interactive game → answer 3 questions → earn stars. Each world ends in a 10-minute exit ticket. <strong>No printing needed!</strong></div></div></section>`}
function mapView(){return `<section class="paper pane"><div class="section-head"><div><div class="ribbon">🗺️ ADVENTURE SELECT</div><h2 class="pixel">THE PIXEL GARDEN MAP</h2><p class="subtitle">Choose a world. Complete missions to unlock the next adventure.</p></div>${pill(saved.done.length+'/10 levels cleared')}</div><div class="meter"><div style="width:${saved.done.length*10}%"></div></div><div class="grid">${WORLDS.map((w,i)=>{let open=worldAvailable(i),done=saved.passes.includes(i),completed=w.levelIds.filter(id=>saved.done.includes(id)).length;return `<article class="world-card"><div class="picture" style="${img(w.scene)}"></div><div class="lock">${done?'🏆 COMPLETE':open?'🔓 OPEN':'🔒 LOCKED'}</div><div class="body"><div class="card-badges">${pill('WORLD '+(i+1))}${pill(w.tier,w.tier==='EXTENDED'?'extend':'core')}</div><h3>${w.emoji} ${w.name}</h3><p>${w.subtitle}</p><div class="progress-sm"><div style="width:${completed/w.levelIds.length*100}%"></div></div><p class="tiny">${completed}/${w.levelIds.length} lessons • 90 minutes</p>${button(open?'ENTER WORLD →':'LOCKED · PASS EARLIER WORLD',`nav('world',${i})`,open?'green':'ghost')}${!open?'<p class="tiny">Earn the previous world passport to unlock.</p>':''}</div></article>`}).join('')}</div><hr class="divider"><div class="checkpoint">${button('← HOME',"nav('home')",'ghost')} ${button('🎓 TEACHER / LESSON PLAN',"nav('teacher')",'blue')}</div></section>`}
function worldView(i){if(!worldAvailable(i)){return `<div class="paper pane"><h2>🔒 World locked</h2><p>Complete the previous world and pass its exit ticket to unlock this area.</p>${button('BACK TO MAP',"nav('map')",'blue')}</div>`}let w=WORLDS[i],d=w.levelIds.every(x=>saved.done.includes(x));return `<section class="paper"><div class="world-hero" style="${img(w.scene)}"><div><div class="ribbon" style="color:#c6f7cd">WORLD 0${i+1} · 90-MIN TUTORING ADVENTURE</div><h1 class="pixel">${w.emoji} ${w.name}</h1><p>${w.subtitle}</p></div></div><div class="pane"><div class="section-head"><div><h2 class="pixel">CHOOSE YOUR MISSION</h2><p class="subtitle">Each mission: Learn → Play → Practice → Reward!</p></div>${pill(w.tier,w.tier==='EXTENDED'?'extend':'core')}</div><div class="grid three">${w.levelIds.map(id=>{const l=LESSONS[id],open=lessonAvailable(id);return `<article class="level-card ${open?'':'locked'}"><div class="picture" style="${img(l.scene)}"></div><div class="body">${pill('LEVEL '+(id+1))}<h3>${l.emoji} ${l.name}</h3><p class="tiny">${l.desc}</p><p>${saved.done.includes(id)?'<span class="done">✅ CLEARED · 75 XP</span>':open?'🎮 Ready to play':'🔒 Clear the previous level'}</p>${button(saved.done.includes(id)?'REPLAY ↻':open?'PLAY LEVEL ▶':'LOCKED',`nav('lesson',${id})`,open?'green':'ghost')}</div></article>`}).join('')}</div><div class="sprint"><strong>⏰ SUGGESTED 90-MINUTE PLAN</strong><div class="timeline">${w.schedule.map(t=>`<span>${t}</span>`).join('')}</div></div><section class="panel yellow"><div class="section-head"><div><div class="ribbon">FINAL CHECK · 10 MINUTES</div><h3>🎟️ Exit Ticket ${i+1}: ${EXITS[i].name}</h3><p>3 individual questions, 10-minute countdown, instant score after submission.</p></div>${pill(saved.passes.includes(i)?'🏆 PASSED':d?'🔓 READY':'🔒 AFTER MISSIONS')}</div>${button(saved.passes.includes(i)?'RETRY EXIT TICKET':d?'START EXIT TICKET →':'FINISH ALL LEVELS FIRST',`nav('exit',${i})`,d?'pink':'ghost')}</section><div class="checkpoint" style="margin-top:20px">${button('← ALL WORLDS',"nav('map')",'ghost')}${i<3&&saved.passes.includes(i)?button('NEXT WORLD →',`nav('world',${i+1})`,'green'):''}</div></div></section>`}
function lessonView(i){if(!lessonAvailable(i))return `<div class="paper pane"><h2>🔒 Clear the previous level first</h2>${button('WORLD MAP',"nav('map')")}</div>`;let l=LESSONS[i],w=WORLDS[l.world];let tabs=[['learn','📚 LEARN'],['play','🎮 PLAY'],['practice','🧠 PRACTISE']];return `<section class="paper"><div class="lesson-splash" style="${img(l.scene)}"><div class="words"><div class="ribbon" style="color:#c1ffce">WORLD ${l.world+1} / LEVEL ${i+1} · ${l.tag}</div><h1 class="pixel">${l.emoji} ${l.name}</h1></div></div><div class="pane"><div class="section-head"><p>${l.desc}</p>${pill(saved.done.includes(i)?'🏆 COMPLETED':'🎯 +75 XP')}</div><div class="tabs" role="tablist">${tabs.map(([x,n],j)=>`<button class="tab ${subStage===x?'on':''}" onclick="setStage('${x}')" role="tab" aria-selected="${subStage===x}">${j+1}. ${n}</button>`).join('')}</div><div id="lesson-body"></div><hr class="divider"><div class="checkpoint">${button('← WORLD',`nav('world',${l.world})`,'ghost')}<div class="tiny">❀ ${w.name} · Short challenges beat long worksheets.</div></div></div></section>`}
function setStage(s){if(s==='play'&&!lessonLearned[route.index]&&stepNum<LESSONS[route.index].steps.length-1&&!saved.done.includes(route.index)){notify('📚 Read the three example steps first.');return}if(s==='play')lessonLearned[route.index]=true;if(s==='practice'&&!mini.won&&!saved.done.includes(route.index)){notify('🎮 Win the mini-game first to unlock the checkpoint.');return}subStage=s;stepNum=0;quiz=0;answered=false;mini={};document.querySelectorAll('.tab').forEach((b,i)=>{const selected=['learn','play','practice'][i]===s;b.classList.toggle('on',selected);b.setAttribute('aria-selected',String(selected))});$('#lesson-body').innerHTML=lessonPart();initLessonStage();window.scrollTo({top:180,behavior:'smooth'})}
function lessonPart(){let i=route.index,l=LESSONS[i];if(subStage==='learn')return `<div class="lesson-stage"><section class="panel green"><div class="ribbon">A QUICK EXPLANATION — BEFORE THE GAME</div><h2>🧠 Watch the worked example</h2><p>${l.example}</p><div class="math-box">${esc(l.formula)}</div><div class="steps">${l.steps.slice(0,stepNum+1).map((s,j)=>`<div class="example-step" data-n="${j+1}">${s}</div>`).join('')}</div><div class="toolbar">${stepNum<l.steps.length-1?button('NEXT EXAMPLE STEP →',"nextStep()",'blue'):button('GOT IT! PLAY THE GAME 🎮',"setStage('play')",'green')}</div></section><aside><div class="scene-tile" style="${img(l.scene)}"></div><div class="panel yellow" style="margin-top:17px"><h3>🧭 Mission briefing</h3><p>${l.task}</p><p class="tiny">No need to memorise everything. Try, see feedback, and learn by doing.</p></div></aside></div>`;
if(subStage==='play')return `<div class="lesson-stage"><section class="panel blue"><div class="ribbon">INTERACTIVE MINI-GAME · LEVEL ${i+1}</div><h2>🎮 ${l.name}</h2><p>${l.task}</p><div id="game-content">${gameContent(i)}</div><div id="mini-feedback" class="feedback" role="status">${gameHint(i)}</div><div id="mini-next">${mini.won?button('CLAIM YOUR STARS · PRACTISE →',"setStage('practice')",'green'):'<button type="button" class="btn ghost" disabled>🔒 COMPLETE THE MINI-GAME FIRST</button>'}</div></section><aside><div class="scene-tile" style="${img(l.scene)}"></div><div class="panel yellow" style="margin-top:16px"><h3>📍 Maths compass</h3><div class="math-box">${esc(l.formula)}</div><details class="teacher"><summary>💡 Need the example again?</summary><p>${l.steps.join(' ')}</p></details></div></aside></div>`;
if(subStage==='practice')return practicePart(i);return ''}

const BOARD={xmin:-6,xmax:7,ymin:-6,ymax:8,W:620,H:410,ml:48,mr:25,mt:20,mb:35};
function Gx(x){return BOARD.ml+(x-BOARD.xmin)/(BOARD.xmax-BOARD.xmin)*(BOARD.W-BOARD.ml-BOARD.mr)}
function Gy(y){return BOARD.mt+(BOARD.ymax-y)/(BOARD.ymax-BOARD.ymin)*(BOARD.H-BOARD.mt-BOARD.mb)}
function pathFor(fn){let p=[];for(let x=BOARD.xmin;x<=BOARD.xmax+.0001;x+=.055){let y=fn(x);if(Number.isFinite(y))p.push(`${p.length?'L':'M'}${Gx(x).toFixed(2)},${Gy(y).toFixed(2)}`)}return p.join(' ')}

center">${opts.caption||'Blue = parabola · Grid is mathematically scaled.'}</div></div>`}
function tapGraph(ev,type){const el=ev.currentTarget,pt=el.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;let q=pt.matrixTransform(el.getScreenCTM().inverse());let x=(q.x-BOARD.ml)/(BOARD.W-BOARD.ml-BOARD.mr)*(BOARD.xmax-BOARD.xmin)+BOARD.xmin,y=BOARD.ymax-(q.y-BOARD.mt)/(BOARD.H-BOARD.mt-BOARD.mb)*(BOARD.ymax-BOARD.ymin);const sets={plot:[[-1,0],[1,-4],[3,0]],roots:[[-2,0],[2,0]],vertex:[[2,5]],intersect:[[0,-3],[3,0]]};let targets=sets[type],next=targets[(mini.hits||[]).length];if(!next)return;let distance=Math.hypot(x-next[0],y-next[1]);if(distance<.48){mini.hits=mini.hits||[];mini.hits.push({x:next[0],y:next[1],label:'★'});$('#mini-feedback').className='feedback good';$('#mini-feedback').textContent=`⭐ Caught point (${next[0]}, ${next[1]})! ${mini.hits.length}/${targets.length}`;sfx();if(mini.hits.length===targets.length){completeMini()}else{$('#game-content').innerHTML=gameContent(route.index)}}else{const f=$('#mini-feedback');f.className='feedback bad';f.textContent=`🎯 Look for (${next[0]}, ${next[1]}). Your tap was around (${x.toFixed(1)}, ${y.toFixed(1)}). Try the next crossing!`;sfx('error')}}
